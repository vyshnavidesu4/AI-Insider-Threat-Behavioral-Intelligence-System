version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: threat_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat_intel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threat_intel_pass}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threat_intel_user} -d ${POSTGRES_DB:-threat_intel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threat_intel_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-threat_intel_user}:${POSTGRES_PASSWORD:-threat_intel_pass}@postgres:5432/${POSTGRES_DB:-threat_intel_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-regional-bank-soc-insecure-dev-secret-key-change-in-production-93821038}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-regional-bank-soc-insecure-refresh-dev-secret-key-change-in-production-192837}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React + Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threat_intel_frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
